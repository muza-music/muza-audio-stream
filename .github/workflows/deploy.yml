name: Build and Deploy Audio Stream

on:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_REPOSITORY: muza/audio-stream
  CONTAINER_NAME: audio-stream

jobs:
